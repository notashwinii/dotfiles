# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

#autogenerated = 1 # remove this line to remove the warning


# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=eDP-1,1920x1080@60,0x0,1
monitor=HDMI-A-1,1920x1080@180,1920x0,1
# monitor=HDMI-A-1,1920x1080@100,1920x0,1
# monitor=HDMI-A-1,1920x1080@60,1920x0,1,mirror,eDP-1
# monitor=HDMI-A-1,1600x900@60,1920x0,1
# monitor=HDMI-A-1,1600x900@60,1920x0,mirror,eDP-1



# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favoritt apps at launch
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ~/.config/hypr/xdg-portal-hyprland
exec-once = ~/.config/waybar/launch.sh
# [device] ~/.local/bin/spotify-adblocked does not exist here
# exec-once = /home/ash/.local/bin/spotify-adblocked
# exec-once = sudo kmonad ~/.config/kmonad/config.kbd
# Open the primary workspace apps after Hyprland starts. Later windows stay on
# the workspace from which they are launched.
exec-once = [workspace 1 silent] brave --profile-directory=Default
exec-once = [workspace 2 silent] alacritty
exec-once = [workspace 6 silent] discord
# exec-once = microsoft-edge-beta
# No HyprPM plugins are configured. Avoid invoking HyprPM at login, which would
# otherwise show a stale-header warning after Hyprland upgrades.
# exec-once = hyprpm reload -n
# exec-once = alacritty
# [device] swaybg not installed and ~/Downloads/bg.png is missing
# exec-once = swaybg -m fill -i ~/Downloads/bg.png
# Keep both text and images available after their source application closes.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# [device] this box runs systemd-networkd (ethernet enp7s0); NetworkManager is installed but
# [device] disabled, so nm-applet would be a dead tray icon. Enabling NetworkManager alongside
# [device] networkd can break connectivity -- switch deliberately, then uncomment this.
# exec-once = nm-applet
exec-once = obsidian
exec-once = dunst
# exec-once = waybar & hyprpaper & firefox

# exec-once=/usr/lib/polkit-kde-authentication-agent-1

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
# env = XCURSOR_SIZE,24

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    repeat_rate = 100
    repeat_delay = 200

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = .3 # -1.0 - 1.0, 0 means no modification.

}

cursor {
    no_hardware_cursors = true
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 4
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = master
}

# misc {
#     focus_on_activate = true
# }

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10

    blur {
        enabled = true
        size = 7
        passes = 2
        new_optimizations = true
    }

    # drop_shadow = yes
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = no

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 2, myBezier
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 2, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    # [device] removed in Hyprland 0.56 (pseudotiling is always on; SUPER+P still toggles it)
    preserve_split = yes # you probably want this
    permanent_direction_override = 1
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    allow_small_split = false
    special_scale_factor = 0.8
    mfact = 0.60
    new_on_active = true
    new_on_top = false
    # no_gaps_when_only = 0
    orientation = left
    # [device] master:inherit_fullscreen removed in Hyprland 0.56
    # always_center_master = false
    smart_resizing = true


}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # [device] replaced by `gesture = 3, horizontal, workspace` below (Hyprland 0.51+)
    workspace_swipe_distance = 700
    # [device] finger count now lives in the `gesture =` line below
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_min_speed_to_force = 5

    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 0

    workspace_swipe_create_new = true
}

# [device] Hyprland 0.51+ gesture syntax (replaces gestures:workspace_swipe / _fingers)
gesture = 3, horizontal, workspace

# workspace rule
# [device] This machine currently has only eDP-1 connected (HDMI-A-1 is unplugged), so the
# [device] HDMI pins are commented out -- otherwise workspaces 1-5, 9 and 10 are bound to a
# [device] monitor that isn't there. Uncomment the block below when you dock the second screen.
# workspace = 1, monitor:HDMI-A-1, default:true
# workspace = 2, monitor:HDMI-A-1, default:true
# workspace = 3, monitor:HDMI-A-1, default:true
# workspace = 4, monitor:HDMI-A-1, default:true
# workspace = 5, monitor:HDMI-A-1, default:true
workspace = 6, monitor:eDP-1, default:true
workspace = 7, monitor:eDP-1, default:true
workspace = 8, monitor:eDP-1, default:true
# workspace = 9, monitor:HDMI-A-1, default:true
# workspace = 10, monitor:HDMI-A-1, default:true

# workspace = 1, monitor:eDP-1, default:true
# workspace = 2, monitor:eDP-1, default:true
# workspace = 3, monitor:eDP-1, default:true
# workspace = 4, monitor:eDP-1, default:true
# workspace = 5, monitor:eDP-1, default:true
# workspace = 6, monitor:HDMI-A-1, default:true
# workspace = 7, monitor:HDMI-A-1, default:true
# workspace = 8, monitor:HDMI-A-1, default:true
# workspace = 9, monitor:eDP-1, default:true
# workspace = 10, monitor:eDP-1, default:true

# screen sharing fix
# [device] Hyprland 0.56 rewrote window rules: `windowrulev2 = <effect>,<match>` is now a
# [device] `windowrule { name / match {} / <effect> = <value> }` block. Effects converted 1:1.
windowrule {
    name = xwaylandvideobridge-hide
    match {
        class = ^(xwaylandvideobridge)$
    }
    opacity = 0.0 override 0.0 override
    no_anim = true
    no_focus = true
    no_initial_focus = true
}

# Workspace Rules
windowrule {
    name = ws2-zen
    match {
        class = ^(.*zen.*)$
    }
    workspace = 2
}

windowrule {
    name = ws6-chromium-class
    match {
        class = ^(.*Chromium.*)$
    }
    workspace = 6
}

windowrule {
    name = ws6-chromium-title
    match {
        title = ^(.*Chromium.*)$
    }
    workspace = 6
}

windowrule {
    name = ws9-thorium
    match {
        class = ^(.*thorium.*)$
    }
    workspace = 9
}

windowrule {
    name = ws10-notion
    match {
        class = ^(.*notion.*)$
    }
    workspace = 10
}

windowrule {
    name = ws3-microsoft
    match {
        class = ^(.*microsoft.*)$
    }
    workspace = 3
}

windowrule {
    name = ws5-spotify
    match {
        class = ^(.*Spotify.*)$
    }
    workspace = 5
}

windowrule {
    name = ws8-obsidian
    match {
        class = ^(.*obsidian.*)$
    }
    workspace = 8
}

# Opacity Control
windowrule {
    name = opacity-thunar
    match {
        class = ^(thunar)$
    }
    opacity = 0.8 0.8
}

windowrule {
    name = opacity-firefox-figma
    match {
        class = ^(firefox)$
        title = ^(.*Figma.*)$
    }
    opacity = 1.0 1.0
}

windowrule {
    name = opacity-firefox-youtube
    match {
        class = ^(firefox)$
        title = ^(.*YouTube.*)$
    }
    opacity = 1.0 1.0
}

# Floating Windows
windowrule {
    name = wofi-no-border
    match {
        class = ^(wofi)$
    }
    border_size = 0
}

windowrule {
    name = float-thunar
    match {
        class = ^(thunar)$
    }
    float = true
}

windowrule {
    name = float-pavucontrol
    match {
        class = ^(pavucontrol)$
    }
    float = true
}

windowrule {
    name = float-blueman
    match {
        class = ^(blueman-manager)$
    }
    float = true
    size = 650 400
}

